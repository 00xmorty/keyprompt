name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: zsh -n keyprompt

      - name: Built-in unit tests
        run: ./keyprompt --self-test

      - name: Full test suite
        run: sh test/test_keyprompt.sh

      - name: Smoke run (text + JSON)
        run: |
          # --only + Apple-signed binary must be clean (exit 0)
          ./keyprompt --only --no-service --service security
          # Full scan: exit 1 is expected when an unstable consumer exists on the runner,
          # so the status code is asserted separately from the payload.
          set +e
          ./keyprompt --json --no-color > /tmp/keyprompt.json
          scan_rc=$?
          set -e
          echo "full-scan exit code: $scan_rc (0=clean, 1=unstable consumer found)"
          case "$scan_rc" in 0|1) ;; *) echo "unexpected exit code"; exit 1 ;; esac
          python3 -c 'import json;d=json.load(open("/tmp/keyprompt.json"));assert d["read_only"] is True;assert isinstance(d["results"],list) and len(d["results"])>0;print("json ok:",len(d["results"]),"records")'

      - name: Ensure no secret-reading keychain flags
        run: |
          set -e
          if sed -e 's/[[:space:]]*#.*$//' keyprompt | grep -Eq 'dump-keychain|security[^|]*-[a-zA-Z]*[gw]([[:space:]]|$)'; then
            echo "forbidden keychain flag found"; exit 1
          fi
          echo "read-only guarantee holds"
